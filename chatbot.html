<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Collar Worker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        #chat {
            width: 500px;
            height: 400px;
            margin: 20px auto;
            border: 1px solid #ccc;
            padding: 10px;
            overflow-y: auto;
        }

        #userInput {
            width: 450px;
            padding: 10px;
        }
    </style>
</head>

<body>

    <h1><strong>Tuffchat</strong></h1>

    <img src="Blue-Dude.png" height=300  alt="Chat image">

    <div id="chat"></div>

    <input
        type="text"
        id="userInput"
        placeholder="Type a message..."
        onkeypress="handleUserInput(event)"
    >

    <script src="chatz.js"></script>

</body>
</html>
